<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>FOUND</title>
<meta name="description" content="A multiplayer voxel object hunt. Pick a thing, find every copy hidden around the house with your friends, open gift boxes.">
<link rel="icon" href="mark.svg?v=__V__" type="image/svg+xml">
<link rel="preload" href="fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=__V__">
</head>
<body>
<canvas id="world" aria-label="The game world"></canvas>

<div id="boot" class="boot"><img src="logo.svg?v=__V__" alt="FOUND"><i class="boot-cube"></i><p id="boot-msg">Loading</p></div>

<!-- menu: name, shop, locker, practice, explore. Opens over the lobby; there are no party codes, everyone shares one lobby -->
<section id="home" class="home" hidden>
  <div class="card home-card">
    <button class="btn icon home-min" data-a="menu" title="Close" aria-label="Close menu">&#x2715;</button>
    <img class="logo" src="logo.svg?v=__V__" alt="FOUND">
    <label class="field"><span>Your name</span><input id="name" maxlength="14" autocomplete="off" spellcheck="false"></label>
    <button class="btn black big" data-a="play" id="back-lobby" hidden>Back to the lobby</button>
    <div class="home-tools">
      <button class="btn big" data-a="shop">Shop<i class="badge shop-badge" hidden></i></button>
      <button class="btn big" data-a="locker">Locker</button>
    </div>
    <div class="home-tools solo">
      <button class="btn big" data-a="practice">Practice<small>Alone, vs bots</small></button>
      <button class="btn big" data-a="explore">Explore<small>Walk the maps</small></button>
    </div>
    <div class="home-tools earn">
      <button class="btn" data-a="idle" id="idle-b">Collect</button>
      <button class="btn" data-a="spin" id="spin-b">Daily spin</button>
      <button class="btn" data-a="mini" id="mini-b">Odd one out</button>
    </div>
    <div class="home-foot"><span class="pill coin coins"></span></div>
  </div>
</section>

<!-- explore: walk any map alone, no party -->
<div id="roam" class="roam" hidden>
  <button class="btn icon" data-a="roamexit" title="Back" aria-label="Back">&#x2715;</button>
  <button class="btn icon gear" data-a="settings" title="Settings" aria-label="Settings">&#x2699;</button>
  <div class="roam-chip"><b id="roam-name">House</b><button class="btn sm" data-a="roamnext">Next map</button><button class="btn sm" data-a="roamshuffle">Rearrange</button></div>
</div>

<!-- the lobby and rounds. Lobby-only pieces carry .lobby-only and vanish during a round. Everything along the bottom lives in #dock so nothing overlaps. -->
<section id="hud" class="hud" hidden>
  <div class="hud-tl">
    <button class="btn icon lobby-only" data-a="menu" title="Menu (M)" aria-label="Menu">&#x2630;</button>
    <button class="btn icon gear" data-a="settings" title="Settings" aria-label="Settings">&#x2699;</button>
  </div>
  <div class="hp" id="hp" hidden><span class="hp-ico">&#x2665;</span><i><u id="hp-fill"></u><b id="hp-n">150</b></i><em id="hp-k">0</em></div>
  <div class="hud-tr lobby-only">
    <span class="pill coin coins"></span>
    <button class="btn" data-a="shop">Shop<i class="badge shop-badge" hidden></i></button>
    <button class="btn" data-a="locker">Locker</button>
  </div>
  <aside class="board lobby-only" id="board"></aside>
  <div class="target" id="role" hidden></div>
  <div class="timer" id="timer" hidden></div>
  <div class="feed" id="feed"></div>
  <div class="actions" id="actions" hidden>
    <button class="btn tag-btn" data-a="tag" id="tag">Tag</button>
  </div>
  <div class="big-count" id="big-count" hidden></div>
  <div class="keys" id="keys" hidden><span><kbd>WASD</kbd> move</span><span><kbd>Space</kbd> jump</span><span><kbd>F</kbd> fire</span><span><kbd>1-9</kbd> guns</span></div>
  <div class="dock" id="dock">
    <div class="lobby-bar" id="lobby-bar"></div>
    <div class="hotbar" id="hotbar" hidden aria-label="Your guns"></div>
  </div>
  <button class="btn nade" id="nade" hidden aria-label="Throw gadget (G)"><img id="nade-i" alt=""><small>G</small></button>
  <button class="btn fire" id="fire" hidden aria-label="Fire (hold)"><img id="fire-i" alt=""><span>FIRE</span><small id="fire-g">F</small></button>
  <div class="rip" id="rip" hidden><h2>You're out</h2><p>Back in <b id="rip-n">3</b></p></div>
  <div class="hurt" id="hurt"></div>
  <div class="flash" id="flash"></div>
  <div class="scope" id="scope" hidden></div>
</section>
<div class="blind" id="blind" hidden><h2>Hiders are hiding</h2><b id="blind-n"></b><p>You seek when the timer ends.</p></div>

<div class="joy" id="joy" hidden><i></i></div>
<button class="btn round jump" id="jump" hidden aria-label="Jump">&#x2191;</button>

<div id="layer" class="layer" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="three.min.js?v=__V__"></script>
<script src="catalog.js?v=__V__"></script>
<script src="objects.js?v=__V__"></script>
<script src="layout.js?v=__V__"></script>
<script src="guns.js?v=__V__"></script>
<script src="armor.js?v=__V__"></script>
<script src="gadgets.js?v=__V__"></script>
<script src="avatar-data.js?v=__V__"></script>
<script src="extra-items.js?v=__V__"></script>
<script src="auras.js?v=__V__"></script>
<script src="avatar.js?v=__V__"></script>
<script src="world.js?v=__V__"></script>
<script src="app.js?v=__V__"></script>
</body>
</html>
