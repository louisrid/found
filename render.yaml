services:
  - type: web
    name: found
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      # Set DATABASE_URL to a Render Postgres connection string so profiles survive restarts.
      # The admin (Louis) switches guns on in the lobby. Pick a private code and enter it once in the game's Admin button.
      - key: ADMIN_CODE
        sync: false
