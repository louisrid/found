services:
  - type: web
    name: found
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      # Set DATABASE_URL to a Render Postgres connection string so profiles survive restarts.
      # Signs the copy of each profile kept on the player's device, so accounts come back after the server's disk is wiped.
      - key: SNAP_SECRET
        generateValue: true
